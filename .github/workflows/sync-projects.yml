name: Sync project metadata

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-refresh] # other repos can ping this on push

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Enrich-only: refreshes last_updated, stars, language, homepage and
      # status from the GitHub API. Never touches hand-written copy.
      - name: Refresh GitHub-managed fields
        run: node scripts/sync-github-projects.mjs
        env:
          # Optional. Unauthenticated is 60 req/hr, which is plenty for ~6
          # repos once a week, but a token avoids shared-runner rate limits.
          GH_TOKEN: ${{ secrets.PORTFOLIO_GH_PAT }}

      - name: Validate the result
        run: node scripts/validate-content.mjs

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): refresh project metadata from GitHub"
          title: "chore(data): refresh project metadata"
          body: |
            Automated weekly refresh of GitHub-managed fields only:
            `last_updated`, `stars`, `language`, `homepage`, `status`.

            Hand-written fields (title, short, desc, architecture, metric,
            ops, tech, cover, category, featured) are never modified by this
            job — `projects.json` remains the source of truth for those.

            The run log also reports any repo that 404s or has been archived,
            and any repo that now has enough GitHub metadata to be generated
            rather than curated.
          branch: bot/sync-projects
          add-paths: src/data/projects.json
